<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>贪吃蛇</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #050d05; font-family: monospace; overflow: hidden; color: #0f0; }
body { display: flex; align-items: center; justify-content: center; flex-direction: column; background: radial-gradient(circle at 50% 40%, #0a220a 0%, #000 70%); padding: 12px; }
#wrap { position: relative; width: 100%; max-width: 760px; }
canvas { width: 100% !important; height: auto !important; aspect-ratio: 4 / 3; background: #020a02; box-shadow: 0 0 22px #0f0, inset 0 0 18px rgba(0,255,0,.25); border: 2px solid #0f0; border-radius: 6px; display: block; touch-action: none; }
#hud { position: absolute; left: 10px; top: 8px; font-size: clamp(12px, 1.8vw, 16px); line-height: 1.4; text-shadow: 0 0 6px #0f0; pointer-events: none; z-index: 5; }
button { background: transparent; color: #0f0; border: 1px solid #0f0; font-family: monospace; cursor: pointer; text-shadow: 0 0 6px #0f0; box-shadow: 0 0 8px rgba(0,255,0,.5); }
#pauseBtn { position: absolute; right: 10px; top: 8px; padding: 4px 10px; font-size: 13px; border-radius: 4px; z-index: 5; }
#restartBtn { position: absolute; left: 50%; top: 58%; transform: translate(-50%,-50%); padding: 10px 22px; font-size: 16px; border-radius: 6px; display: none; z-index: 9; }
#homeBtn { position: absolute; left: 10px; bottom: -32px; padding: 5px 10px; font-size: 13px; border-radius: 4px; text-decoration: none; z-index: 5; color: #0f0; border: 1px solid #0f0; }
#hint { margin-top: 40px; font-size: 12px; opacity: .75; text-shadow: 0 0 5px #0f0; text-align: center; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">分数: 0<br>最高: 0<br>长度: 3</div>
  <button id="pauseBtn">暂停</button>
  <button id="restartBtn">重新开始</button>
  <a id="homeBtn" href="/">🏠 大厅</a>
</div>
<div id="hint">方向键 / WASD 控制 · P 暂停 · R 重开 · 手机滑动控制</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const LW=480,LH=360;canvas.width=LW;canvas.height=LH;
const cell=20,cols=LW/cell,rows=LH/cell;
let snake,dir,nextDir,food,score,over,paused,timer,flashTimer,speed;
const hud=document.getElementById('hud'),pauseBtn=document.getElementById('pauseBtn'),restartBtn=document.getElementById('restartBtn');
function getBest(){return +localStorage.getItem('snake_best')||0}
function setBest(v){localStorage.setItem('snake_best',v)}
function reset(){
  snake=[{x:10,y:9},{x:9,y:9},{x:8,y:9}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;over=false;paused=false;flashTimer=0;speed=130;
  pauseBtn.textContent='暂停';restartBtn.style.display='none';
  placeFood();clearInterval(timer);timer=setInterval(step,speed);updateHud();draw();
}
function placeFood(){while(true){const f={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)};if(!snake.some(s=>s.x===f.x&&s.y===f.y)){food=f;break}}}
function updateHud(){const best=getBest();hud.innerHTML=`分数: ${score}<br>最高: ${best}<br>长度: ${snake.length}`;}
function step(){dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=cols||head.y<0||head.y>=rows)return die();if(snake.some(s=>s.x===head.x&&s.y===head.y))return die();snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;if(score%50===0&&speed>55){speed-=8;clearInterval(timer);timer=setInterval(step,speed)}placeFood()}else snake.pop();updateHud();draw();}
function die(){over=true;clearInterval(timer);flashTimer=12;const best=getBest();let isNew=false;if(score>best){setBest(score);isNew=true}restartBtn.style.display='block';draw();ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,0,LW,LH);ctx.fillStyle='#0f0';ctx.textAlign='center';ctx.font='bold 28px monospace';ctx.fillText('游戏结束',LW/2,LH/2-36);ctx.font='16px monospace';ctx.fillText(`分数: ${score}`,LW/2,LH/2-6);ctx.fillStyle='#0a0';ctx.font='14px monospace';ctx.fillText(`最高分: ${Math.max(best,score)}${isNew?'  🎉新纪录!':''}`,LW/2,LH/2+20);ctx.font='12px monospace';ctx.fillStyle='#060';ctx.fillText('按 R 或点按钮重开',LW/2,LH/2+46);}
function draw(){ctx.clearRect(0,0,LW,LH);ctx.strokeStyle='rgba(0,255,0,.07)';ctx.lineWidth=1;for(let x=0;x<cols;x++){ctx.beginPath();ctx.moveTo(x*cell+0.5,0);ctx.lineTo(x*cell+0.5,LH);ctx.stroke()}for(let y=0;y<rows;y++){ctx.beginPath();ctx.moveTo(0,y*cell+0.5);ctx.lineTo(LW,y*cell+0.5);ctx.stroke()}snake.forEach((s,i)=>{if(i===0){ctx.fillStyle='#bfff00';ctx.shadowColor='#0f0';ctx.shadowBlur=8;ctx.fillRect(s.x*cell+1,s.y*cell+1,cell-2,cell-2);ctx.shadowBlur=0;ctx.fillStyle='#000';const ex=dir.x,ey=dir.y;if(ex===1){ctx.fillRect(s.x*cell+cell*0.62,s.y*cell+cell*0.25,3,3);ctx.fillRect(s.x*cell+cell*0.62,s.y*cell+cell*0.62,3,3)}else if(ex===-1){ctx.fillRect(s.x*cell+cell*0.18,s.y*cell+cell*0.25,3,3);ctx.fillRect(s.x*cell+cell*0.18,s.y*cell+cell*0.62,3,3)}else if(ey===-1){ctx.fillRect(s.x*cell+cell*0.25,s.y*cell+cell*0.18,3,3);ctx.fillRect(s.x*cell+cell*0.62,s.y*cell+cell*0.18,3,3)}else{ctx.fillRect(s.x*cell+cell*0.25,s.y*cell+cell*0.62,3,3);ctx.fillRect(s.x*cell+cell*0.62,s.y*cell+cell*0.62,3,3)}}else{const t=i/snake.length;ctx.fillStyle=`rgb(${120+Math.floor(t*80)},${230-Math.floor(t*120)},40)`;ctx.fillRect(s.x*cell+2,s.y*cell+2,cell-4,cell-4)}});const pulse=0.8+Math.sin(Date.now()/180)*0.18;ctx.fillStyle=`rgba(255,${90+Math.floor(Math.sin(Date.now()/150)*40)},50,${pulse})`;ctx.shadowColor='rgba(255,80,0,.8)';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(food.x*cell+cell/2,food.y*cell+cell/2,cell*0.38,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(flashTimer>0){ctx.fillStyle=`rgba(255,0,0,${0.28*flashTimer/12})`;ctx.fillRect(0,0,LW,LH);flashTimer--}if(paused&&!over){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,LW,LH);ctx.fillStyle='#0f0';ctx.textAlign='center';ctx.font='bold 24px monospace';ctx.fillText('暂停中',LW/2,LH/2)}}
function setDir(x,y){if(dir.x===-x&&dir.y===-y)return;if(nextDir.x===-x&&nextDir.y===-y)return;if(x===0&&y===0)return;nextDir={x,y}}
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'){e.preventDefault();setDir(0,-1)}else if(e.key==='ArrowDown'||e.key==='s'||e.key==='S'){e.preventDefault();setDir(0,1)}else if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){e.preventDefault();setDir(-1,0)}else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){e.preventDefault();setDir(1,0)}else if(e.key==='p'||e.key==='P')togglePause();else if(e.key==='r'||e.key==='R')reset()});
pauseBtn.onclick=togglePause;restartBtn.onclick=reset;
function togglePause(){if(over)return;paused=!paused;if(paused){clearInterval(timer);pauseBtn.textContent='继续'}else{timer=setInterval(step,speed);pauseBtn.textContent='暂停'}draw()}
let tx=null,ty=null;
canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(tx===null)return;const dx=e.touches[0].clientX-tx,dy=e.touches[0].clientY-ty;if(Math.abs(dx)<18&&Math.abs(dy)<18)return;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:false});
reset();
</script>
</body>
</html>
