<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boxianjian 小游戏</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background: radial-gradient(circle at 50% 30%, #0a220a 0%, #000 70%);
  font-family: monospace;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: #0f0; padding: 20px;
}
h1 { font-size: 28px; text-shadow: 0 0 12px #0f0; margin-bottom: 8px; }
p { color: #0a0; margin-bottom: 32px; font-size: 14px; }
.grid {
  display: grid; grid-template-columns: 1fr; gap: 16px;
  width: 100%; max-width: 320px;
}
.card {
  display: block; padding: 22px 16px;
  border: 2px solid #0f0; border-radius: 12px;
  background: rgba(0,255,0,.06);
  color: #0f0; text-decoration: none;
  text-align: center; font-size: 18px;
  box-shadow: 0 0 14px rgba(0,255,0,.35);
  transition: .2s;
}
.card:hover { background: rgba(0,255,0,.18); box-shadow: 0 0 22px #0f0; transform: scale(1.03); }
.card span { font-size: 32px; display: block; margin-bottom: 6px; }
.footer { margin-top: 32px; font-size: 11px; color: #060; }
</style>
</head>
<body>
<h1>🎮 Boxianjian 小游戏</h1>
<p>点击进入，永久免费 · 手机电脑都能玩</p>
<div class="grid">
  <a class="card" href="plane.html"><span>✈️</span>飞机大战</a>
  <a class="card" href="snake.html"><span>🐍</span>贪吃蛇</a>
</div>
<div class="footer">Made with ❤️ by Boxianjian · GitHub Pages</div>
</body>
</html>
