<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boxianjian 小游戏</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100dvh;
  background: radial-gradient(#002200, #000);
  color: #0f0; font-family: system-ui, sans-serif;
  overflow-x: hidden;
  padding: env(safe-area-inset-top) 20px calc(20px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#splash {
  position: fixed; inset: 0; background: #000; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity .6s;
}
#splash.hide { opacity: 0; pointer-events: none; }
#splash .logo {
  font-size: 34px; font-weight: bold; letter-spacing: 3px;
  text-shadow: 0 0 18px #0f0; animation: pulse 1.2s infinite alternate;
  text-align: center; padding: 0 12px;
}
#splash .sub { margin-top: 12px; color: #0a0; font-size: 13px; }
#splash .bar { margin-top: 22px; width: 180px; height: 6px; background: #022; border: 1px solid #0f0; border-radius: 4px; overflow: hidden; }
#splash .bar i { display: block; height: 100%; width: 0; background: #0f0; animation: load 1.4s linear forwards; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.04); } }
@keyframes load { to { width: 100%; } }

#home { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
#home.show { display: flex; }
h1 { font-size: 28px; text-shadow: 0 0 12px #0f0; margin: 0 0 8px; text-align: center; }
p.tip { color: #0a0; margin: 0 0 32px; font-size: 14px; text-align: center; }
.grid { display: grid; grid-template-columns: 1fr; gap: 16px; width: 100%; max-width: 320px; }
.card {
  display: block; padding: 22px 16px; border: 2px solid #0f0; border-radius: 12px;
  background: rgba(0,255,0,.06); color: #0f0; text-decoration: none; text-align: center;
  font-size: 18px; box-shadow: 0 0 14px rgba(0,255,0,.35); transition: .2s;
}
.card:hover { background: rgba(0,255,0,.18); box-shadow: 0 0 22px #0f0; transform: scale(1.03); }
.card span { font-size: 32px; display: block; margin-bottom: 6px; }
.footer { margin-top: 32px; font-size: 11px; color: #060; text-align: center; }
</style>
</head>
<body>
<div id="splash">
  <div class="logo">✈️🐍🏃🧱 BOXIANJIAN</div>
  <div class="sub">小游戏合集 · 加载中…</div>
  <div class="bar"><i></i></div>
</div>

<div id="home">
  <h1>🎮 Boxianjian 小游戏</h1>
  <p class="tip">点击进入，永久免费 · 手机电脑都能玩</p>
  <div class="grid">
    <a class="card" href="plane.html"><span>✈️</span>飞机大战</a>
    <a class="card" href="snake.html"><span>🐍</span>贪吃蛇</a>
    <a class="card" href="runner.html"><span>🏃</span>像素跑酷</a>
    <a class="card" href="tetris.html"><span>🧱</span>俄罗斯方块</a>
  </div>
  <div class="footer">Made with ❤️ by Boxianjian · GitHub Pages</div>
</div>

<script>
setTimeout(() => {
  const s = document.getElementById('splash');
  s.classList.add('hide');
  setTimeout(() => {
    s.style.display = 'none';
    document.getElementById('home').classList.add('show');
  }, 600);
}, 1500);
</script>
</body>
</html>
