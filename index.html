<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boxianjian 小游戏</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #050d05; color: #0f0; font-family: monospace;
  min-height: 100vh; min-height: 100dvh;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: max(env(safe-area-inset-top), 20px) 16px max(env(safe-area-inset-bottom), 30px);
}
#splash {
  position: fixed; inset: 0; background: #050510; z-index: 9999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.6s ease;
}
#splash.hide { opacity: 0; pointer-events: none; }
#splash .logo { font-size: clamp(22px, 6vw, 34px); font-weight: bold; letter-spacing: 3px; text-shadow: 0 0 18px #0f0; animation: pulse 1.2s infinite alternate; text-align: center; padding: 0 12px; }
#splash .sub { margin-top: 12px; color: #0a0; font-size: 13px; }
#splash .bar { margin-top: 22px; width: 180px; height: 6px; background: #022; border: 1px solid #0f0; border-radius: 4px; overflow: hidden; }
#splash .bar i { display: block; height: 100%; width: 0; background: #0f0; animation: load 1.4s linear forwards; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.04); } }
@keyframes load { to { width: 100%; } }
#home { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; width: 100%; max-width: 400px; margin: 0 auto; padding: 20px 0 40px; }
h1 { font-size: clamp(22px, 6vw, 28px); text-shadow: 0 0 12px #0f0; margin-bottom: 8px; text-align: center; }
p.tip { color: #0a0; margin-bottom: 28px; font-size: 14px; text-align: center; }
.grid { display: grid; grid-template-columns: 1fr; gap: 16px; width: 100%; }
.card {
  display: block; padding: 22px 16px; border: 2px solid #0f0; border-radius: 12px;
  background: rgba(0,255,0,.06); color: #0f0; text-decoration: none; text-align: center;
  font-size: 18px; box-shadow: 0 0 14px rgba(0,255,0,.35); transition: .2s;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
.card:hover, .card:active { background: rgba(0,255,0,.18); box-shadow: 0 0 22px #0f0; transform: scale(1.03); }
.card span { font-size: 32px; display: block; margin-bottom: 6px; }
.footer { margin-top: 36px; font-size: 11px; color: #060; text-align: center; padding-bottom: 20px; }
</style>
</head>
<body>
<div id="splash">
  <div class="logo">✈️🐍🏃 BOXIANJIAN</div>
  <div class="sub">小游戏合集 · 加载中…</div>
  <div class="bar"><i></i></div>
</div>
<div id="home">
  <h1>🎮 Boxianjian 小游戏</h1>
  <p class="tip">点击进入，永久免费 · 手机电脑都能玩</p>
  <div class="grid">
    <a class="card" href="plane.html"><span>✈️</span>飞机大战</a>
    <a class="card" href="snake.html"><span>🐍</span>贪吃蛇</a>
    <a class="card" href="runner.html"><span>🏃</span>像素跑酷</a>
  </div>
  <div class="footer">Made with ❤️ by Boxianjian · GitHub Pages</div>
</div>
<script>
setTimeout(() => {
  const s = document.getElementById('splash');
  s.classList.add('hide');
  setTimeout(() => { s.style.display = 'none'; }, 600);
}, 1500);
</script>
</body>
</html>
