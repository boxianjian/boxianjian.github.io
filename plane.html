<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>飞机大战 · 满屏换弹版</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; touch-action: none; }
  canvas { display: block; margin: 0 auto; background: #050510; }
  #ui { position: fixed; top: 10px; left: 10px; z-index: 10; font-family: sans-serif; }
  .btn { background: rgba(0,0,0,.6); color: #0ff; border: 1px solid #0ff; padding: 6px 12px; margin: 4px; cursor: pointer; border-radius: 4px; font-size: 14px; }
  .btn:hover { background: #0ff; color: #000; }
  #menu { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; color: #fff; font-family: sans-serif; z-index: 20; background: rgba(0,0,0,.85); padding: 30px; border-radius: 10px; border: 1px solid #0ff; }
  #menu h1 { margin: 0 0 20px; color: #0ff; }
  #menu button { display: block; width: 200px; margin: 10px auto; padding: 10px; background: transparent; color: #0ff; border: 1px solid #0ff; cursor: pointer; font-size: 16px; }
  #menu button:hover { background: #0ff; color: #000; }
</style>
</head>
<body>
<div id="ui" style="display:none;">
  <button class="btn" id="pauseBtn">⏸ 暂停</button>
  <button class="btn" onclick="backMenu()">🏠 返回</button>
</div>
<div id="menu">
  <h1>✈️ 飞机大战</h1>
  <button onclick="startSingle('easy')">单人 · 简单</button>
  <button onclick="startSingle('normal')">单人 · 普通</button>
  <button onclick="startSingle('hard')">单人 · 困难</button>
  <button onclick="startMulti()">双人同屏</button>
</div>
<canvas id="cv"></canvas>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W, H;
// 【改动1】电脑满屏：取消 480 限制，直接铺满窗口，并监听 resize
function resize() {
  W = cv.width = window.innerWidth;
  H = cv.height = window.innerHeight;
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
}
window.addEventListener('resize', resize);
resize();

let mode = 'menu', over = false, multiOver = false, paused = false;
let enemyTimer = 0, bullets = [], enemies = [], particles = [], stars = [];
let p1, p2;
let keys = {}, touchActive = false, dragX = 0, dragY = 0;

for (let i = 0; i < 150; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.5 + 0.5 });

function makePlayer(x, color) {
  return {
    x, y: H - 80, w: 36, h: 48, hp: 5, maxHp: 5,
    ammo: 40, maxAmmo: 40, cool: 0, invuln: 0,
    reloading: false, reloadT: 0, reloadMax: 90, // 【改动2】1.5秒(90帧)强制换弹
    color, dead: false, score: 0,
    wbox: 24, hbox: 34 // 【改动3】碰撞箱缩小（视觉36x48，实际判定24x34）
  };
}

function startSingle(diff) {
  mode = 'single'; over = false; paused = false;
  bullets = []; enemies = []; particles = []; enemyTimer = 0;
  let cfg = diff === 'easy' ? { hp: 5, maxAmmo: 40, spd: 3, efreq: 70 } : diff === 'normal' ? { hp: 5, maxAmmo: 40, spd: 4, efreq: 55 } : { hp: 5, maxAmmo: 40, spd: 5, efreq: 42 };
  p1 = makePlayer(W / 2 - 18, '#0af');
  p1.maxHp = p1.hp = cfg.hp; p1.maxAmmo = cfg.maxAmmo; p1.ammo = cfg.maxAmmo;
  p1.spd = cfg.spd; p1.efreq = cfg.efreq;
  document.getElementById('menu').style.display = 'none';
  document.getElementById('ui').style.display = 'block';
  document.getElementById('pauseBtn').textContent = '⏸ 暂停';
}

function startMulti() {
  mode = 'multi'; multiOver = false; paused = false;
  bullets = []; enemies = []; particles = []; enemyTimer = 0;
  p1 = makePlayer(W / 3 - 18, '#0af');
  p2 = makePlayer(W * 2 / 3 - 18, '#f0a');
  [p1, p2].forEach(p => { p.maxAmmo = 99; p.ammo = 99; p.spd = 4; p.efreq = 0; });
  document.getElementById('menu').style.display = 'none';
  document.getElementById('ui').style.display = 'block';
}

function backMenu() {
  mode = 'menu'; over = true; multiOver = true; paused = false;
  document.getElementById('menu').style.display = 'block';
  document.getElementById('ui').style.display = 'none';
}

function togglePause() {
  if (over || multiOver || mode === 'menu') return;
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '▶ 继续' : '⏸ 暂停';
}

function shoot(p) {
  if (p.dead || paused) return;
  // 【换弹逻辑】没子弹强制停火，进入1.5秒换弹
  if (p.ammo <= 0 && !p.reloading) {
    p.reloading = true; p.reloadT = p.reloadMax;
  }
  if (p.reloading) return; // 换弹中禁止射击
  if (p.cool > 0) return;
  bullets.push({ x: p.x + p.w / 2 - 2, y: p.y, w: 4, h: 10, spd: 7, dmg: 1, owner: p });
  p.ammo--; p.cool = 8;
}

function spawnEnemy() {
  let t = Math.random();
  let type = t < 0.5 ? 0 : t < 0.8 ? 1 : 2;
  let w = type === 0 ? 28 : type === 1 ? 34 : 30;
  let h = type === 0 ? 34 : type === 1 ? 30 : 36;
  let e = {
    x: Math.random() * (W - w), y: -h, w, h,
    spd: (type === 0 ? 2 : type === 1 ? 1.5 : 2.5) + (p1?.spd || 4) * 0.2,
    hp: type === 0 ? 1 : type === 1 ? 2 : 2, type,
    wbox: type === 0 ? 18 : type === 1 ? 24 : 20, // 【碰撞箱缩小】
    hbox: type === 0 ? 24 : type === 1 ? 22 : 26
  };
  enemies.push(e);
}

function explode(x, y, c) {
  for (let i = 0; i < 12; i++) {
    particles.push({ x, y, vx: (Math.random() - .5) * 4, vy: (Math.random() - .5) * 4, l: 20, c });
  }
}

function rectHit(a, b) {
  // 使用缩小后的碰撞箱（wbox/hbox）进行中心对齐判定
  let ax = a.x + (a.w - a.wbox) / 2, ay = a.y + (a.h - a.hbox) / 2;
  let bx = b.x + (b.w - b.wbox) / 2, by = b.y + (b.h - b.hbox) / 2;
  return ax < bx + b.wbox && ax + a.wbox > bx && ay < by + b.hbox && ay + a.hbox > by;
}

function update() {
  if (mode === 'menu' || paused) return;
  enemyTimer++;
  if (mode === 'single' && enemyTimer % p1.efreq === 0) spawnEnemy();
  if (mode === 'multi' && enemyTimer % 45 === 0) spawnEnemy();

  // 玩家移动 & 换弹逻辑
  let ps = mode === 'multi' ? [p1, p2] : [p1];
  ps.forEach((p, idx) => {
    if (!p || p.dead) return;
    let spd = p.spd;
    if (mode === 'multi') {
      let L = idx === 0;
      if (keys['KeyW'] && L) p.y -= spd; if (keys['KeyS'] && L) p.y += spd;
      if (keys['KeyA'] && L) p.x -= spd; if (keys['KeyD'] && L) p.x += spd;
      if (keys['ArrowUp'] && !L) p.y -= spd; if (keys['ArrowDown'] && !L) p.y += spd;
      if (keys['ArrowLeft'] && !L) p.x -= spd; if (keys['ArrowRight'] && !L) p.x += spd;
      if (L && keys['Space']) shoot(p); else if (!L && keys['Enter']) shoot(p);
    } else {
      if (keys['ArrowUp'] || keys['KeyW']) p.y -= spd;
      if (keys['ArrowDown'] || keys['KeyS']) p.y += spd;
      if (keys['ArrowLeft'] || keys['KeyA']) p.x -= spd;
      if (keys['ArrowRight'] || keys['KeyD']) p.x += spd;
      if (keys['Space']) shoot(p);
    }
    p.x = Math.max(0, Math.min(W - p.w, p.x));
    p.y = Math.max(60, Math.min(H - p.h, p.y));
    if (p.cool > 0) p.cool--;
    if (p.invuln > 0) p.invuln--;

    // 【1.5秒换弹】换弹完直接满弹匣
    if (p.reloading) {
      p.reloadT--;
      if (p.reloadT <= 0) {
        p.ammo = p.maxAmmo;
        p.reloading = false;
      }
    }
  });

  // 子弹
  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i]; b.y -= b.spd;
    if (b.y < -10) { bullets.splice(i, 1); continue; }
    for (let j = enemies.length - 1; j >= 0; j--) {
      let e = enemies[j];
      if (rectHit(b, e)) {
        e.hp -= b.dmg; explode(b.x, b.y, '#ff0');
        bullets.splice(i, 1);
        if (e.hp <= 0) {
          explode(e.x + e.w / 2, e.y + e.h / 2, e.type === 0 ? '#f00' : e.type === 1 ? '#0f0' : '#a0f');
          enemies.splice(j, 1);
          if (b.owner) b.owner.score++;
        }
        break;
      }
    }
  }

  // 敌机
  for (let j = enemies.length - 1; j >= 0; j--) {
    let e = enemies[j]; e.y += e.spd;
    if (e.y > H + 20) { enemies.splice(j, 1); if (mode === 'single' && !p1.invuln) p1.hp--; continue; }
    ps.forEach(p => {
      if (p.dead || p.invuln) return;
      if (rectHit(p, e)) {
        p.hp--; p.invuln = 60;
        explode(e.x + e.w / 2, e.y + e.h / 2, '#f80');
        enemies.splice(j, 1);
      }
    });
  }

  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    let pt = particles[i]; pt.x += pt.vx; pt.y += pt.vy; pt.l--;
    if (pt.l <= 0) particles.splice(i, 1);
  }

  // 死亡
  if (mode === 'single' && p1.hp <= 0 && !over) { over = true; explode(p1.x + 18, p1.y + 24, '#0af'); p1.dead = true; setTimeout(() => alert('游戏结束！分数: ' + p1.score + '\n最高分: ' + Math.max(p1.score, localStorage.getItem('best') || 0)), 100); }
  if (mode === 'multi' && p1 && p2 && p1.hp <= 0 && p2.hp <= 0 && !multiOver) { multiOver = true; p1.dead = true; p2.dead = true; setTimeout(() => alert('双人都阵亡了！P1: ' + p1.score + ' P2: ' + p2.score), 100); }
}

function drawPlane(x, y, w, h, c, flip) {
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  if (flip) ctx.scale(1, -1);
  const grad = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  grad.addColorStop(0, '#fff'); grad.addColorStop(0.5, c); grad.addColorStop(1, '#000');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, -h / 2);
  ctx.lineTo(w / 2, h / 2 - 10);
  ctx.lineTo(w / 2 - 6, h / 2);
  ctx.lineTo(-w / 2 + 6, h / 2);
  ctx.lineTo(-w / 2, h / 2 - 10);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,255,255,.5)';
  ctx.beginPath(); ctx.moveTo(-4, -4); ctx.lineTo(4, -4); ctx.lineTo(0, 8); ctx.fill();
  if (!flip) {
    let f = 6 + Math.random() * 4;
    ctx.fillStyle = '#f80';
    ctx.beginPath(); ctx.moveTo(-6, h / 2); ctx.lineTo(0, h / 2 + f); ctx.lineTo(6, h / 2); ctx.fill();
  }
  ctx.restore();
}

function drawEnemy(e) {
  let cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  if (e.type === 0) {
    drawPlane(e.x, e.y, e.w, e.h, '#f33', true);
  } else if (e.type === 1) {
    ctx.fillStyle = '#0f0';
    ctx.beginPath(); ctx.arc(cx, cy, e.w / 2, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#080'; ctx.fillRect(e.x, e.y + e.h / 2 - 2, e.w, 4);
  } else {
    ctx.fillStyle = '#a0f';
    ctx.beginPath(); ctx.moveTo(cx, e.y + e.h); ctx.lineTo(e.x + e.w, cy); ctx.lineTo(cx, e.y); ctx.lineTo(e.x, cy); ctx.closePath(); ctx.fill();
    let f = 5 + Math.random() * 6;
    ctx.fillStyle = '#f80'; ctx.beginPath(); ctx.moveTo(cx - 4, e.y); ctx.lineTo(cx, e.y - f); ctx.lineTo(cx + 4, e.y); ctx.fill();
  }
}

function draw() {
  ctx.fillStyle = '#050510'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  stars.forEach(s => { s.y += s.s * 0.5; if (s.y > H) s.y = 0; ctx.fillRect(s.x, s.y, s.s, s.s); });
  particles.forEach(pt => { ctx.fillStyle = pt.c; ctx.fillRect(pt.x, pt.y, 2, 2); });
  enemies.forEach(drawEnemy);
  bullets.forEach(b => { ctx.fillStyle = b.owner === p2 ? '#f0a' : '#0ff'; ctx.fillRect(b.x, b.y, b.w, b.h); });
  let ps = mode === 'multi' ? [p1, p2] : [p1];
  ps.forEach(p => { if (p && !p.dead && (!p.invuln || Math.floor(p.invuln / 5) % 2 === 0)) drawPlane(p.x, p.y, p.w, p.h, p.color, false); });

  // HUD
  if (mode !== 'menu') {
    ctx.fillStyle = '#0ff'; ctx.font = '14px sans-serif';
    let txt = `HP: ${p1.hp}/${p1.maxHp}  弹量: ${p1.ammo}/${p1.maxAmmo}  分数: ${p1.score}`;
    if (p1.reloading) { ctx.fillStyle = '#f80'; txt += `  [换弹中 ${(p1.reloadT / 60).toFixed(1)}s...]`; }
    ctx.fillText(txt, 10, 20);
    if (mode === 'multi' && p2) {
      ctx.fillStyle = '#f0a';
      let txt2 = `P2 HP: ${p2.hp} 弹量: ${p2.ammo} 分数: ${p2.score}`;
      if (p2.reloading) { txt2 += ` [换弹...]`; }
      ctx.fillText(txt2, 10, 40);
    }
  }
  if (paused) { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#0ff'; ctx.textAlign = 'center'; ctx.font = '40px sans-serif'; ctx.fillText('⏸ 暂停', W / 2, H / 2); ctx.textAlign = 'left'; }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

// 触控（单人拖拽）
document.addEventListener('touchstart', e => {
  if (mode !== 'single' || !p1 || p1.dead) return;
  e.preventDefault(); touchActive = true;
  let r = cv.getBoundingClientRect(), tx = e.touches[0].clientX - r.left, ty = e.touches[0].clientY - r.top;
  dragX = tx - (p1.x + p1.w / 2); dragY = ty - (p1.y + p1.h / 2);
  p1.invuln = 30; p1.x = tx - dragX - p1.w / 2; p1.y = ty - dragY - p1.h / 2;
  p1.x = Math.max(0, Math.min(W - p1.w, p1.x)); p1.y = Math.max(60, Math.min(H - p1.h, p1.y));
  shoot(p1);
}, { passive: false });
document.addEventListener('touchmove', e => {
  if (!touchActive || mode !== 'single' || !p1 || p1.dead) return;
  e.preventDefault();
  let r = cv.getBoundingClientRect(), tx = e.touches[0].clientX - r.left, ty = e.touches[0].clientY - r.top;
  p1.x = tx - dragX - p1.w / 2; p1.y = ty - dragY - p1.h / 2;
  p1.x = Math.max(0, Math.min(W - p1.w, p1.x)); p1.y = Math.max(60, Math.min(H - p1.h, p1.y));
  shoot(p1);
}, { passive: false });
document.addEventListener('touchend', () => touchActive = false);

addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space' || e.code === 'Enter') e.preventDefault(); if (e.code === 'KeyP') togglePause(); });
addEventListener('keyup', e => keys[e.code] = false);
document.getElementById('pauseBtn').onclick = togglePause;

loop();
</script>
</body>
</html>
