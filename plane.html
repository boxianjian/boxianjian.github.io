<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>飞机大战</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #000; overflow: hidden; font-family: monospace; }
#cv { display: block; background: #000; touch-action: none; }
#hud { position: fixed; top: 6px; left: 8px; color: #fff; font-size: 13px; line-height: 1.5; text-shadow: 1px 1px 0 #000; z-index: 5; }
#tip { position: fixed; bottom: 6px; width: 100%; text-align: center; color: #9cf; font-size: 11px; z-index: 5; }
#menu { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
#menu h1 { color: #0f0; text-shadow: 0 0 10px #0f0; }
.diff { width: 200px; margin: 8px; padding: 12px; font: bold 16px monospace; border: 2px solid #0f0; background: rgba(0,255,0,.08); color: #0f0; border-radius: 10px; cursor: pointer; }
.diff:hover { background: rgba(0,255,0,.25); }
#over { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; color: #fff; }
#over button { margin-top: 16px; padding: 12px 30px; font: bold 16px monospace; border: 2px solid #4cf; background: rgba(0,120,220,.5); color: #fff; border-radius: 10px; cursor: pointer; }
#pauseBtn { position: fixed; right: 8px; top: 6px; z-index: 9; padding: 6px 12px; font: bold 13px monospace; border: 2px solid #fc4; border-radius: 8px; background: rgba(120,80,0,.5); color: #fff; cursor: pointer; }
#homeBtn { position: fixed; left: 8px; top: 6px; z-index: 9; padding: 5px 10px; font-size: 12px; border: 1px solid #4cf; border-radius: 6px; background: rgba(0,80,180,.5); color: #fff; cursor: pointer; text-decoration: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"></div>
<div id="tip">↑↓←→ / WASD 移动 · 空格射击 · 手机拖动 · P 暂停</div>
<a id="homeBtn" href="index.html">🏠 大厅</a>
<button id="pauseBtn" onclick="togglePause()">⏸ 暂停</button>

<div id="menu">
  <h1>✈️ 飞机大战</h1>
  <button class="diff" onclick="start('easy')">😊 简单</button>
  <button class="diff" onclick="start('normal')">😐 普通</button>
  <button class="diff" onclick="start('hard')">😈 困难</button>
</div>

<div id="over">
  <div style="font-size:24px">游戏结束</div>
  <div id="overScore" style="margin-top:10px"></div>
  <button onclick="showMenu()">🔄 重新开始</button>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H;
function resize(){ W = cv.width = Math.min(innerWidth, 480); H = cv.height = innerHeight; }
resize();
addEventListener('resize', resize);

const menu = document.getElementById('menu');
const overEl = document.getElementById('over');
const hud = document.getElementById('hud');
const pauseBtn = document.getElementById('pauseBtn');

const DIFF = {
  easy:   { bossHp:30, every:250, fire:80, spawn:55, ammo:40, dodge:false },
  normal: { bossHp:45, every:200, fire:56, spawn:42, ammo:30, dodge:false },
  hard:   { bossHp:65, every:150, fire:40, spawn:30, ammo:20, dodge:true }
};

let cfg, player, bullets, enemies, boss, particles, stars;
let score, over, paused, enemyTimer, bossTimer, bossCount, reloadTimer, raf;

function start(d){
  cfg = DIFF[d];
  menu.style.display = 'none';
  overEl.style.display = 'none';
  reset();
}

function showMenu(){
  overEl.style.display = 'none';
  menu.style.display = 'flex';
  cancelAnimationFrame(raf);
}

function reset(){
  player = { x: W/2-20, y: H-80, w:40, h:48, speed:5, ammo:cfg.ammo, maxAmmo:cfg.ammo, cool:0, hp:3, invuln:0, flash:0, scatter:0, rapid:0 };
  bullets = []; enemies = []; boss = null; particles = [];
  stars = Array.from({length:70}, () => ({ x:Math.random()*W, y:Math.random()*H, s:Math.random()*2+.5, sp:Math.random()*1+.4 }));
  score = 0; over = false; paused = false; pauseBtn.textContent = '⏸ 暂停';
  enemyTimer = 0; bossTimer = 0; bossCount = 0; reloadTimer = 0;
  loop();
}

function shoot(){
  if(player.ammo<=0 || reloadTimer>0) return;
  const r = player.rapid>0, s = player.scatter>0;
  if(s){
    bullets.push({x:player.x+player.w/2-3,y:player.y,w:2,h:10,vy:-8,vx:-1.5});
    bullets.push({x:player.x+player.w/2-1,y:player.y,w:2,h:10,vy:-8,vx:0});
    bullets.push({x:player.x+player.w/2+1,y:player.y,w:2,h:10,vy:-8,vx:1.5});
  } else {
    bullets.push({x:player.x+player.w/2-1,y:player.y,w:2,h:10,vy:-8,vx:0});
  }
  if(r) bullets.push({x:player.x+player.w/2-1,y:player.y-4,w:2,h:10,vy:-9,vx:0});
  player.ammo--; player.cool = r?4:8;
  if(player.ammo<=0 && reloadTimer<=0) reloadTimer = 45;
}

function spawnEnemy(){
  enemies.push({ x:Math.random()*(W-36), y:-36, w:36, h:36, vy:1.2+Math.random()*1.8, type:Math.floor(Math.random()*3) });
}
function spawnBoss(){
  boss = { x:W/2-44, y:-90, w:88, h:68, vy:0.9, vx:1.1, hp:cfg.bossHp, maxHp:cfg.bossHp, phase:1, ft:0, enterY:68 };
}
function explode(x,y,c,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28, sp=1+Math.random()*3; particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:30,c}); }
function hit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

function hurt(){
  if(player.invuln>0 || over) return;
  player.hp--; player.invuln=90; player.flash=18;
  explode(player.x+player.w/2, player.y+player.h/2, '#4cf', 18);
  if(player.hp<=0){ over=true; gameOver(); }
}
function gameOver(){
  cancelAnimationFrame(raf);
  document.getElementById('overScore').textContent = '分数: '+score+'　最高: '+Math.max(score, +localStorage.getItem('planeBest')||0);
  if(score > (+localStorage.getItem('planeBest')||0)) localStorage.setItem('planeBest', score);
  overEl.style.display = 'flex';
}

function loop(){
  if(over || paused) return;
  raf = requestAnimationFrame(loop);
  update();
  draw();
}

function update(){
  // 玩家移动
  if(keys['ArrowLeft']||keys['KeyA']) player.x -= player.speed;
  if(keys['ArrowRight']||keys['KeyD']) player.x += player.speed;
  if(keys['ArrowUp']||keys['KeyW']) player.y -= player.speed;
  if(keys['ArrowDown']||keys['KeyS']) player.y += player.speed;
  player.x = Math.max(0, Math.min(W-player.w, player.x));
  player.y = Math.max(60, Math.min(H-player.h, player.y));

  if(player.cool>0) player.cool--;
  if(player.invuln>0) player.invuln--;
  if(player.flash>0) player.flash--;
  if(player.scatter>0) player.scatter--;
  if(player.rapid>0) player.rapid--;
  if(reloadTimer>0){ reloadTimer--; if(reloadTimer<=0) player.ammo = player.maxAmmo; }
  if((keys['Space']||touch) && player.cool<=0 && reloadTimer<=0) shoot();

  // 子弹
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i]; b.x+=b.vx; b.y+=b.vy;
    if(b.y+b.vy<0 || b.x+b.w<0 || b.x>W) bullets.splice(i,1);
  }

  // 敌机
  if(!boss){
    if(++enemyTimer > cfg.spawn){ spawnEnemy(); enemyTimer=0; }
    for(const e of enemies) e.y += e.vy;
    for(let i=enemies.length-1;i>=0;i--){
      if(enemies[i].y>H){ enemies.splice(i,1); hurt(); }
    }
  }

  // 玩家子弹打敌机 / boss
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if(b.vy>=0) continue;
    if(!boss){
      for(let j=enemies.length-1;j>=0;j--){
        const e=enemies[j];
        if(b.x<e.x+e.w && b.x+2>e.x && b.y<e.y+e.h && b.y+b.h>e.y){
          enemies.splice(j,1); bullets.splice(i,1); score+=10;
          explode(e.x+e.w/2,e.y+e.h/2,'#f55',14);
          break;
        }
      }
    }
    if(boss && bossTimer===2){
      if(b.x<boss.x+boss.w && b.x+2>boss.x && b.y<boss.y+boss.h && b.y+b.h>boss.y){
        boss.hp--; bullets.splice(i,1); explode(b.x,b.y,'#ff0',4);
        if(boss.hp<=0){
          bullets = bullets.filter(x=>x.vy<0);
          explode(boss.x+boss.w/2,boss.y+boss.h/2,'#fa0',34);
          score+=200; boss=null; bossTimer=0; bossCount++;
        }
      }
    }
  }

  // boss 子弹打玩家
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if(b.vy<=0) continue;
    if(hit(b,player) && player.invuln<=0){
      hurt(); bullets.splice(i,1); explode(b.x,b.y,'#0ff',6);
    }
  }

  // 敌机撞玩家
  if(!boss){
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      if(e.y<0) continue;
      if(hit(e,player) && player.invuln<=0){ hurt(); enemies.splice(i,1); }
    }
    if(bossTimer===0 && score >= cfg.every*(bossCount+1)){
      bossCount++; bossTimer=1; spawnBoss(); enemies=[];
    }
  }

  // boss AI
  if(boss){
    if(bossTimer===1){ boss.y+=boss.vy; if(boss.y>=boss.enterY) bossTimer=2; }
    else if(bossTimer===2){
      if(boss.phase===1 && boss.hp<=boss.maxHp*0.5){ boss.phase=2; explode(boss.x+boss.w/2,boss.y+boss.h/2,'#ff0',26); }
      boss.x+=boss.vx;
      if(boss.x<=0){ boss.x=0; boss.vx=Math.abs(boss.vx); }
      if(boss.x+boss.w>=W){ boss.x=W-boss.w; boss.vx=-Math.abs(boss.vx); }

      if(cfg.dodge || boss.phase===2){
        for(const b of bullets){
          if(b.vy>=0) continue;
          if(b.y<boss.y+boss.h+60 && b.y>boss.y-200 && b.x+b.w>boss.x && b.x<boss.x+boss.w){
            boss.vx = (b.x<boss.x+boss.w/2) ? Math.abs(boss.vx)*1.5 : -Math.abs(boss.vx)*1.5;
            break;
          }
        }
      }

      if(++boss.ft > (boss.phase===2?Math.max(24,cfg.fire-10):cfg.fire)){
        boss.ft=0; const n=boss.phase===2?5:3;
        for(let i=0;i<n;i++) bullets.push({ x:boss.x+boss.w/2-2, y:boss.y+boss.h, w:4, h:8, vy:3.2, vx:(i-(n-1)/2)*0.6 });
      }
      if(hit(boss,player) && player.invuln<=0) hurt();
    }
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life--;
    if(p.life<=0) particles.splice(i,1);
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for(const s of stars){ s.y+=s.sp; if(s.y>H)s.y=0; ctx.globalAlpha=.5; ctx.fillRect(s.x,s.y,s.s,s.s); }
  ctx.globalAlpha=1;

  // 玩家
  if(!over){
    ctx.save();
    ctx.globalAlpha = (player.invuln>0 && Math.floor(player.invuln/4)%2===0)?0.35:1;
    const p=player, fl=5+Math.random()*5;
    ctx.fillStyle='#f80'; ctx.beginPath(); ctx.moveTo(p.x+p.w/2-7,p.y+p.h); ctx.lineTo(p.x+p.w/2,p.y+p.h+fl); ctx.lineTo(p.x+p.w/2+7,p.y+p.h); ctx.fill();
    ctx.fillStyle='#ff0'; ctx.beginPath(); ctx.moveTo(p.x+p.w/2-3,p.y+p.h); ctx.lineTo(p.x+p.w/2,p.y+p.h+fl*.65); ctx.lineTo(p.x+p.w/2+3,p.y+p.h); ctx.fill();
    const g=ctx.createLinearGradient(p.x,p.y,p.x,p.y+p.h); g.addColorStop(0,'#6cf'); g.addColorStop(.5,'#36a'); g.addColorStop(1,'#124');
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(p.x+p.w/2,p.y); ctx.lineTo(p.x+2,p.y+p.h-4); ctx.lineTo(p.x+8,p.y+p.h); ctx.lineTo(p.x+p.w-8,p.y+p.h); ctx.lineTo(p.x+p.w-2,p.y+p.h-4); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#0ff'; ctx.beginPath(); ctx.ellipse(p.x+p.w/2,p.y+p.h*.3,7,10,0,0,6.28); ctx.fill();
    ctx.restore();
  }
  if(player.flash>0){ ctx.fillStyle='rgba(255,0,0,'+(0.28*player.flash/18)+')'; ctx.fillRect(0,0,W,H); }

  // 子弹
  for(const b of bullets){
    if(b.vy<0){ ctx.fillStyle='#ff5'; ctx.fillRect(b.x,b.y,2,10); }
    else { ctx.fillStyle='#0ff'; ctx.fillRect(b.x,b.y,4,8); }
  }
  // 敌机
  for(const e of enemies){
    const col=[['#f33','#f99','#c00'],['#3f3','#9f9','#0c0'],['#c3f','#e8f','#80c']][e.type];
    ctx.fillStyle=col[0]; ctx.fillRect(e.x+4,e.y+8,e.w-8,e.h-16);
    ctx.fillStyle=col[1]; ctx.fillRect(e.x,e.y+e.h*.4,8,10); ctx.fillRect(e.x+e.w-8,e.y+e.h*.4,8,10);
    ctx.fillStyle='#ff0'; ctx.fillRect(e.x+e.w/2-3,e.y+e.h-4,6,5);
  }
  // boss
  if(boss){
    const c1=boss.phase===2?'#f80':'#c00';
    const g=ctx.createLinearGradient(boss.x,boss.y,boss.x,boss.y+boss.h); g.addColorStop(0,'#320'); g.addColorStop(1,c1);
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(boss.x+boss.w/2,boss.y); ctx.lineTo(boss.x+4,boss.y+boss.h*.65); ctx.lineTo(boss.x+12,boss.y+boss.h); ctx.lineTo(boss.x+boss.w-12,boss.y+boss.h); ctx.lineTo(boss.x+boss.w-4,boss.y+boss.h*.65); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#f00'; ctx.beginPath(); ctx.ellipse(boss.x+boss.w/2,boss.y+boss.h*.4,14,10,0,0,6.28); ctx.fill();
    if(boss.phase===2){ ctx.strokeStyle='rgba(255,200,0,.6)'; ctx.setLineDash([6,4]); ctx.beginPath(); ctx.arc(boss.x+boss.w/2,boss.y+boss.h/2,boss.w*.6,0,6.28); ctx.stroke(); ctx.setLineDash([]); }
    // 血条
    const bw=Math.min(380,W-20), bx=(W-bw)/2;
    ctx.fillStyle='#333'; ctx.fillRect(bx,10,bw,16);
    ctx.fillStyle='#f80'; ctx.fillRect(bx,10,bw*Math.max(0,boss.hp/boss.maxHp),16);
    ctx.strokeStyle='#fff'; ctx.strokeRect(bx,10,bw,16);
    ctx.fillStyle='#fff'; ctx.font='bold 12px monospace'; ctx.textAlign='center';
    ctx.fillText('BOSS '+boss.hp+'/'+boss.maxHp+(boss.phase===2?' 阶段2/2':' 阶段1/2'), W/2, 24);
  }
  // 粒子
  for(const p of particles){ ctx.globalAlpha=p.life/30; ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,3,3); }
  ctx.globalAlpha=1;

  // HUD
  let h='HP '; for(let i=0;i<3;i++) h+=i<player.hp?'❤️':'🖤';
  h+='<br>弹匣 '+player.ammo+'/'+player.maxAmmo;
  if(reloadTimer>0) h+='<br>换弹 '+Math.ceil(reloadTimer/30)+'s';
  if(player.scatter>0) h+='<br>🟩散射 '+Math.ceil(player.scatter/60)+'s';
  if(player.rapid>0) h+='<br>🟦速射 '+Math.ceil(player.rapid/60)+'s';
  h+='<br>分数 '+score+'<br>最高 '+(+localStorage.getItem('planeBest')||0);
  hud.innerHTML=h;
}

const keys={}; let touch=false, dx=0, dy=0;
addEventListener('keydown',e=>{ keys[e.code]=true; if(e.code==='Space')e.preventDefault(); if(e.code==='KeyP')togglePause(); });
addEventListener('keyup',e=>{ keys[e.code]=false; });
function togglePause(){ if(over)return; paused=!paused; pauseBtn.textContent=paused?'▶ 继续':'⏸ 暂停'; if(!paused) loop(); }

cv.addEventListener('touchstart',e=>{ e.preventDefault(); touch=true; const r=cv.getBoundingClientRect(); dx=(e.touches[0].clientX-r.left)-(player.x+player.w/2); dy=(e.touches[0].clientY-r.top)-(player.y+player.h/2); },{passive:false});
cv.addEventListener('touchmove',e=>{ e.preventDefault(); if(!touch)return; const r=cv.getBoundingClientRect(); player.x=(e.touches[0].clientX-r.left)-dx-player.w/2; player.y=(e.touches[0].clientY-r.top)-dy-player.h/2; player.x=Math.max(0,Math.min(W-player.w,player.x)); player.y=Math.max(60,Math.min(H-player.h,player.y)); },{passive:false});
cv.addEventListener('touchend',e=>{ e.preventDefault(); touch=false; },{passive:false});
</script>
</body>
</html>
