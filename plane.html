<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>飞机大战</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; overflow: hidden; font-family: monospace; touch-action: none; }
canvas { display: block; }
#hud { position: fixed; top: 6px; left: 8px; color: #fff; font-size: 13px; line-height: 1.5; text-shadow: 1px 1px 0 #000; z-index: 5; }
#menu { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
#menu h1 { color: #0f0; font-size: 24px; margin-bottom: 24px; text-shadow: 0 0 10px #0f0; }
.diff { width: 200px; padding: 12px; margin: 8px; font: bold 16px monospace; border: 2px solid #0f0; background: rgba(0,255,0,.08); color: #0f0; border-radius: 10px; cursor: pointer; }
.diff:hover { background: rgba(0,255,0,.25); }
#over { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; color: #fff; }
#over div { font-size: 22px; margin-bottom: 10px; }
#over button { margin-top: 10px; padding: 12px 30px; font: bold 16px monospace; border: 2px solid #4cf; background: rgba(0,120,220,.5); color: #fff; border-radius: 10px; cursor: pointer; }
#pauseBtn { position: fixed; right: 8px; top: 6px; z-index: 9; padding: 6px 12px; font: bold 13px monospace; border: 2px solid #fc4; border-radius: 8px; background: rgba(120,80,0,.5); color: #fff; cursor: pointer; }
#homeBtn { position: fixed; left: 8px; top: 6px; z-index: 9; padding: 5px 10px; font-size: 12px; border: 1px solid #4cf; border-radius: 6px; background: rgba(0,80,180,.5); color: #fff; cursor: pointer; text-decoration: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"></div>
<a id="homeBtn" href="index.html">🏠 大厅</a>
<button id="pauseBtn" onclick="togglePause()">⏸ 暂停</button>
<div id="menu">
  <h1>✈️ 飞机大战</h1>
  <button class="diff" onclick="start('easy')">😊 简单</button>
  <button class="diff" onclick="start('normal')">😐 普通</button>
  <button class="diff" onclick="start('hard')">😈 困难</button>
</div>
<div id="over">
  <div id="overText"></div>
  <button onclick="showMenu()">🔄 重新开始</button>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H;
function resize(){ W = cv.width = Math.min(innerWidth, 480); H = cv.height = innerHeight; }
resize();
addEventListener('resize', resize);

const menu = document.getElementById('menu');
const overEl = document.getElementById('over');
const hud = document.getElementById('hud');
const pauseBtn = document.getElementById('pauseBtn');

const DIFF = {
  easy:   { bossHp: 30, miniHp: 12, every: 250, miniEvery: 100, fire: 80, miniFire: 60, spawn: 55, ammo: 40, dodge: true },
  normal: { bossHp: 45, miniHp: 18, every: 250, miniEvery: 100, fire: 56, miniFire: 42, spawn: 42, ammo: 30, dodge: true },
  hard:   { bossHp: 65, miniHp: 25, every: 250, miniEvery: 100, fire: 40, miniFire: 30, spawn: 30, ammo: 20, dodge: true }
};

let cfg, player, bullets, enemies, boss, miniBoss, particles, props, stars;
let score, over, paused, enemyTimer, bossTimer, miniTimer, bossCount, miniCount, reloadTimer, raf;
let keys = {}, touchActive = false, dragX = 0, dragY = 0;

function initStars() {
  stars = [];
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      s: Math.random() * 2 + 0.5,
      sp: Math.random() * 1.5 + 0.8  // 速度提快了
    });
  }
}

function start(d) {
  cfg = DIFF[d];
  menu.style.display = 'none';
  overEl.style.display = 'none';
  reset();
}

function showMenu() {
  overEl.style.display = 'none';
  menu.style.display = 'flex';
  cancelAnimationFrame(raf);
}

function reset() {
  player = { x: W/2-20, y: H-80, w: 40, h: 48, speed: 5, ammo: cfg.ammo, maxAmmo: cfg.ammo, cool: 0, hp: 3, invuln: 0, flash: 0, scatter: 0, rapid: 0 };
  bullets = []; enemies = []; boss = null; miniBoss = null; particles = []; props = [];
  initStars();
  score = 0; over = false; paused = false; pauseBtn.textContent = '⏸ 暂停';
  enemyTimer = 0; bossTimer = 0; miniTimer = 0; bossCount = 0; miniCount = 0; reloadTimer = 0;
  loop();
}

function shoot() {
  if (player.ammo <= 0 || reloadTimer > 0) return;
  const r = player.rapid > 0, s = player.scatter > 0;
  if (s) {
    if (player.ammo < 3) return;
    bullets.push({ x: player.x+player.w/2-6, y: player.y, w: 4, h: 12, vy: -9, vx: -2 });
    bullets.push({ x: player.x+player.w/2-2, y: player.y, w: 4, h: 12, vy: -9, vx: 0 });
    bullets.push({ x: player.x+player.w/2+2, y: player.y, w: 4, h: 12, vy: -9, vx: 2 });
    player.ammo -= 3;
    player.cool = r ? 4 : 8;
  } else {
    bullets.push({ x: player.x+player.w/2-2, y: player.y, w: 4, h: 12, vy: -9, vx: 0 });
    if (r) bullets.push({ x: player.x+player.w/2-2, y: player.y-6, w: 4, h: 12, vy: -10, vx: 0 });
    player.ammo -= 1;
    player.cool = r ? 4 : 8;
  }
  if (player.ammo <= 0 && reloadTimer <= 0) reloadTimer = 45;
}

function spawnEnemy() {
  enemies.push({ x: Math.random()*(W-36), y: -40, w: 36, h: 36, vy: 1.2+Math.random()*1.8, type: Math.floor(Math.random()*3) });
}

function spawnMiniBoss() {
  miniBoss = { x: W/2-30, y: -60, w: 60, h: 50, vy: 0.8, vx: 1.5, hp: cfg.miniHp + miniCount*3, maxHp: cfg.miniHp + miniCount*3, ft: 0, enterY: 55, dodgeCd: 0 };
  miniTimer = 1;
}

function spawnBoss() {
  const hpScale = bossCount >= 3 ? (bossCount - 2) * 15 : 0;
  boss = { x: W/2-44, y: -90, w: 88, h: 68, vy: 0.9, vx: 1.2, hp: cfg.bossHp + hpScale, maxHp: cfg.bossHp + hpScale, phase: 1, ft: 0, enterY: 68, dodgeCd: 0 };
  bossTimer = 1;
}

function spawnProp(x, y) {
  const r = Math.random();
  let type;
  if (r < 0.35) type = 'scatter';
  else if (r < 0.6) type = 'ammo';
  else if (r < 0.85) type = 'rapid';
  else type = 'heal';
  const colors = { scatter: '#4c4', ammo: '#f80', rapid: '#4cf', heal: '#f44' };
  props.push({ x: x-11, y: y, w: 22, h: 22, type: type, color: colors[type], vy: 1.2, life: 420 });
}

function explode(x, y, c, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, sp = 1 + Math.random() * 3;
    particles.push({ x: x, y: y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 30, c: c });
  }
}

function hit(a, b) {
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function hurtPlayer() {
  if (player.invuln > 0 || over) return;
  player.hp--; player.invuln = 90; player.flash = 18;
  explode(player.x+player.w/2, player.y+player.h/2, '#4cf', 18);
  if (player.hp <= 0) { over = true; gameOver(); }
}

function gameOver() {
  cancelAnimationFrame(raf);
  const best = +localStorage.getItem('planeBest') || 0;
  const isNew = score > best;
  if (isNew) localStorage.setItem('planeBest', score);
  document.getElementById('overText').innerHTML = '游戏结束<br>分数: ' + score + '<br>最高: ' + Math.max(best, score) + (isNew ? ' 🎉' : '');
  overEl.style.display = 'flex';
}

function loop() {
  if (over || paused) return;
  raf = requestAnimationFrame(loop);
  update(); draw();
}

function update() {
  if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
  if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
  if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
  player.x = Math.max(0, Math.min(W-player.w, player.x));
  player.y = Math.max(60, Math.min(H-player.h, player.y));

  if (player.cool > 0) player.cool--;
  if (player.invuln > 0) player.invuln--;
  if (player.flash > 0) player.flash--;
  if (player.scatter > 0) player.scatter--;
  if (player.rapid > 0) player.rapid--;
  if (reloadTimer > 0) { reloadTimer--; if (reloadTimer <= 0) player.ammo = player.maxAmmo; }
  if ((keys['Space'] || touchActive) && player.cool <= 0 && reloadTimer <= 0) shoot();

  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i]; b.x += b.vx; b.y += b.vy;
    if (b.y + b.vy < 0 || b.x + b.w < 0 || b.x > W) bullets.splice(i, 1);
  }

  if (!boss && !miniBoss) {
    enemyTimer++;
    if (enemyTimer > cfg.spawn) { spawnEnemy(); enemyTimer = 0; }
    for (const e of enemies) e.y += e.vy;
    for (let i = enemies.length-1; i >= 0; i--) {
      if (enemies[i].y > H) { enemies.splice(i, 1); hurtPlayer(); }
    }
  }

  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i];
    if (b.vy >= 0) continue;
    const bx = b.x + 1;
    if (!boss && !miniBoss) {
      for (let j = enemies.length-1; j >= 0; j--) {
        const e = enemies[j];
        if (bx < e.x+e.w && bx+2 > e.x && b.y < e.y+e.h && b.y+b.h > e.y) {
          enemies.splice(j, 1); bullets.splice(i, 1); score += 10;
          explode(e.x+e.w/2, e.y+e.h/2, '#f55', 14);
          if (Math.random() < 0.18) spawnProp(e.x+e.w/2, e.y+e.h/2);
          break;
        }
      }
    }
  }

  // 小 Boss
  if (miniBoss) {
    if (miniTimer === 1) {
      miniBoss.y += miniBoss.vy;
      if (miniBoss.y >= miniBoss.enterY) miniTimer = 2;
    } else if (miniTimer === 2) {
      miniBoss.x += miniBoss.vx;
      if (miniBoss.x <= 0) { miniBoss.x = 0; miniBoss.vx = Math.abs(miniBoss.vx); }
      if (miniBoss.x + miniBoss.w >= W) { miniBoss.x = W - miniBoss.w; miniBoss.vx = -Math.abs(miniBoss.vx); }
      if (miniBoss.dodgeCd <= 0) {
        for (const b of bullets) {
          if (b.vy >= 0) continue;
          if (b.y < miniBoss.y+miniBoss.h+50 && b.y > miniBoss.y-150 && b.x+b.w > miniBoss.x && b.x < miniBoss.x+miniBoss.w) {
            miniBoss.vx = (b.x < miniBoss.x+miniBoss.w/2) ? Math.abs(miniBoss.vx)*1.3 : -Math.abs(miniBoss.vx)*1.3;
            miniBoss.dodgeCd = 30;
            break;
          }
        }
      } else { miniBoss.dodgeCd--; }
      miniBoss.ft++;
      if (miniBoss.ft > cfg.miniFire) {
        miniBoss.ft = 0;
        bullets.push({ x: miniBoss.x+miniBoss.w/2-2, y: miniBoss.y+miniBoss.h, w: 4, h: 8, vy: 3.5, vx: 0 });
        bullets.push({ x: miniBoss.x+miniBoss.w/2-8, y: miniBoss.y+miniBoss.h, w: 4, h: 8, vy: 3, vx: -0.5 });
        bullets.push({ x: miniBoss.x+miniBoss.w/2+4, y: miniBoss.y+miniBoss.h, w: 4, h: 8, vy: 3, vx: 0.5 });
      }
    }
  }

  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i];
    if (b.vy >= 0) continue;
    const bx = b.x + 1;
    if (miniBoss && miniTimer === 2) {
      if (bx < miniBoss.x+miniBoss.w && bx+2 > miniBoss.x && b.y < miniBoss.y+miniBoss.h && b.y+b.h > miniBoss.y) {
        miniBoss.hp--; bullets.splice(i, 1); explode(b.x, b.y, '#ff0', 4);
        if (miniBoss.hp <= 0) {
          explode(miniBoss.x+miniBoss.w/2, miniBoss.y+miniBoss.h/2, '#fa0', 28);
          spawnProp(miniBoss.x+miniBoss.w/2, miniBoss.y+miniBoss.h/2);
          miniBoss = null; miniTimer = 0; miniCount++;
        }
      }
    }
  }

  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i];
    if (b.vy <= 0) continue;
    if (hit(b, player) && player.invuln <= 0) { hurtPlayer(); bullets.splice(i, 1); explode(b.x, b.y, '#0ff', 6); }
  }

  if (miniBoss && miniTimer === 2 && hit(miniBoss, player) && player.invuln <= 0) {
    hurtPlayer(); explode(miniBoss.x+miniBoss.w/2, miniBoss.y+miniBoss.h/2, '#fa0', 20); miniBoss = null; miniTimer = 0;
  }

  if (!boss && !miniBoss && miniTimer === 0) {
    if (score >= cfg.miniEvery * (miniCount + 1)) spawnMiniBoss();
  }

  // 正式 Boss
  if (boss) {
    if (bossTimer === 1) { boss.y += boss.vy; if (boss.y >= boss.enterY) bossTimer = 2; }
    else if (bossTimer === 2) {
      if (boss.phase === 1 && boss.hp <= boss.maxHp * 0.5) { boss.phase = 2; explode(boss.x+boss.w/2, boss.y+boss.h/2, '#ff0', 26); }
      boss.x += boss.vx;
      if (boss.x <= 0) { boss.x = 0; boss.vx = Math.abs(boss.vx); }
      if (boss.x + boss.w >= W) { boss.x = W - boss.w; boss.vx = -Math.abs(boss.vx); }
      if (boss.dodgeCd > 0) boss.dodgeCd--;
      if (boss.dodgeCd <= 0) {
        for (const b of bullets) {
          if (b.vy >= 0) continue;
          if (b.y < boss.y+boss.h+60 && b.y > boss.y-200 && b.x+b.w > boss.x && b.x < boss.x+boss.w) {
            boss.vx = (b.x < boss.x+boss.w/2) ? Math.abs(boss.vx) : -Math.abs(boss.vx);
            boss.dodgeCd = 25;
            break;
          }
        }
      }
      boss.ft++;
      const fireInt = boss.phase === 2 ? Math.max(24, cfg.fire-10) : cfg.fire;
      if (boss.ft > fireInt) {
        boss.ft = 0;
        const shots = boss.phase === 2 ? 5 : 3;
        for (let i = 0; i < shots; i++) bullets.push({ x: boss.x+boss.w/2-2, y: boss.y+boss.h, w: 4, h: 8, vy: 3.2, vx: (i-(shots-1)/2)*0.6 });
      }
      if (hit(boss, player) && player.invuln <= 0) hurtPlayer();
    }
  }

  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i];
    if (b.vy >= 0) continue;
    const bx = b.x + 1;
    if (boss && bossTimer === 2) {
      if (bx < boss.x+boss.w && bx+2 > boss.x && b.y < boss.y+boss.h && b.y+b.h > boss.y) {
        boss.hp--; bullets.splice(i, 1); explode(b.x, b.y, '#ff0', 4);
        if (boss.hp <= 0) {
          bullets = bullets.filter(x => x.vy < 0);
          explode(boss.x+boss.w/2, boss.y+boss.h/2, '#fa0', 34);
          score += 200;
          spawnProp(boss.x+boss.w/2, boss.y+boss.h/2);
          boss = null; bossTimer = 0; bossCount++;
        }
      }
    }
  }

  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i];
    if (b.vy <= 0) continue;
    if (hit(b, player) && player.invuln <= 0) { hurtPlayer(); bullets.splice(i, 1); explode(b.x, b.y, '#0ff', 6); }
  }

  if (!boss && !miniBoss) {
    if (score >= cfg.every * (bossCount + 1)) spawnBoss();
  }

  // 道具
  for (let i = props.length-1; i >= 0; i--) {
    const p = props[i]; p.y += p.vy; p.life--;
    if (p.life <= 0) { props.splice(i, 1); continue; }
    if (hit(p, player)) {
      if (p.type === 'scatter') player.scatter = 480;
      if (p.type === 'rapid') player.rapid = 480;
      if (p.type === 'ammo') { player.maxAmmo += 10; player.ammo = player.maxAmmo; }
      if (p.type === 'heal') player.hp = Math.min(3, player.hp + 1);
      explode(p.x+p.w/2, p.y+p.h/2, p.color, 10);
      props.splice(i, 1);
    }
  }

  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawPlayer(p) {
  ctx.save();
  ctx.globalAlpha = (p.invuln > 0 && Math.floor(p.invuln/4)%2 === 0) ? 0.35 : 1;
  const g = ctx.createLinearGradient(p.x, p.y, p.x, p.y+p.h);
  g.addColorStop(0, '#eef'); g.addColorStop(0.5, '#5599ff'); g.addColorStop(1, '#2255cc');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(p.x+p.w/2, p.y); ctx.lineTo(p.x+4, p.y+p.h-8); ctx.lineTo(p.x+12, p.y+p.h); ctx.lineTo(p.x+p.w-12, p.y+p.h); ctx.lineTo(p.x+p.w-4, p.y+p.h-8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3377dd';
  ctx.beginPath(); ctx.moveTo(p.x, p.y+p.h*0.45); ctx.lineTo(p.x-10, p.y+p.h*0.7); ctx.lineTo(p.x+8, p.y+p.h*0.6); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(p.x+p.w, p.y+p.h*0.45); ctx.lineTo(p.x+p.w+10, p.y+p.h*0.7); ctx.lineTo(p.x+p.w-8, p.y+p.h*0.6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#aaf'; ctx.beginPath(); ctx.ellipse(p.x+p.w/2, p.y+p.h*0.28, 8, 10, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(p.x+p.w/2-3, p.y+p.h*0.25, 3, 4, 0, 0, 6.28); ctx.fill();
  const fl = 4 + Math.random()*6;
  ctx.fillStyle = '#f80'; ctx.beginPath(); ctx.moveTo(p.x+p.w/2-5, p.y+p.h); ctx.lineTo(p.x+p.w/2, p.y+p.h+fl); ctx.lineTo(p.x+p.w/2+5, p.y+p.h); ctx.fill();
  ctx.fillStyle = '#ff0'; ctx.beginPath(); ctx.moveTo(p.x+p.w/2-3, p.y+p.h); ctx.lineTo(p.x+p.w/2, p.y+p.h+fl*0.7); ctx.lineTo(p.x+p.w/2+3, p.y+p.h); ctx.fill();
  ctx.restore();
}

function drawEnemy(e) {
  const pal = [['#c22','#f55','#800'],['#2c2','#5f5','#080'],['#82c','#c5f','#408']][e.type];
  ctx.fillStyle = pal[0];
  ctx.beginPath(); ctx.moveTo(e.x+e.w/2, e.y); ctx.lineTo(e.x+4, e.y+e.h-6); ctx.lineTo(e.x+10, e.y+e.h); ctx.lineTo(e.x+e.w-10, e.y+e.h); ctx.lineTo(e.x+e.w-4, e.y+e.h-6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = pal[1]; ctx.fillRect(e.x-4, e.y+e.h*0.4, 8, 10); ctx.fillRect(e.x+e.w-4, e.y+e.h*0.4, 8, 10);
  ctx.fillStyle = pal[2]; ctx.beginPath(); ctx.ellipse(e.x+e.w/2, e.y+e.h*0.38, 5, 6, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#ff0'; ctx.fillRect(e.x+e.w/2-2, e.y+e.h-3, 4, 3);
}

function drawMiniBoss(m) {
  ctx.fillStyle = '#808';
  ctx.beginPath(); ctx.moveTo(m.x+m.w/2, m.y); ctx.lineTo(m.x, m.y+m.h/2); ctx.lineTo(m.x+m.w/2, m.y+m.h); ctx.lineTo(m.x+m.w, m.y+m.h/2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#c0f';
  ctx.beginPath(); ctx.moveTo(m.x+m.w/2, m.y+5); ctx.lineTo(m.x+5, m.y+m.h/2); ctx.lineTo(m.x+m.w/2, m.y+m.h-5); ctx.lineTo(m.x+m.w-5, m.y+m.h/2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f00';
  ctx.beginPath(); ctx.arc(m.x+m.w/2, m.y+m.h/2, 8, 0, 6.28); ctx.fill();
  const bw = 120, bx = m.x + m.w/2 - 60;
  ctx.fillStyle = '#333'; ctx.fillRect(bx, m.y - 14, bw, 8);
  ctx.fillStyle = '#c0f'; ctx.fillRect(bx, m.y - 14, bw * Math.max(0, m.hp/m.maxHp), 8);
  ctx.strokeStyle = '#fff'; ctx.strokeRect(bx, m.y - 14, bw, 8);
}

function drawBoss(b) {
  const c1 = b.phase === 2 ? '#f80' : '#c00';
  const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y+b.h); g.addColorStop(0, '#320'); g.addColorStop(1, c1);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(b.x+b.w/2, b.y); ctx.lineTo(b.x+6, b.y+b.h*0.6); ctx.lineTo(b.x+14, b.y+b.h); ctx.lineTo(b.x+b.w-14, b.y+b.h); ctx.lineTo(b.x+b.w-6, b.y+b.h*0.6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#666'; ctx.fillRect(b.x+8, b.y+b.h-4, 6, 12); ctx.fillRect(b.x+b.w-14, b.y+b.h-4, 6, 12);
  ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.ellipse(b.x+b.w/2, b.y+b.h*0.4, 14, 10, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#ff0'; ctx.beginPath(); ctx.ellipse(b.x+b.w/2, b.y+b.h*0.38, 5, 5, 0, 0, 6.28); ctx.fill();
  if (b.phase === 2) { ctx.strokeStyle = 'rgba(255,200,0,.6)'; ctx.setLineDash([6,4]); ctx.beginPath(); ctx.arc(b.x+b.w/2, b.y+b.h/2, b.w*0.6, 0, 6.28); ctx.stroke(); ctx.setLineDash([]); }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // 星星：每帧直接画+滚动
  ctx.fillStyle = '#fff';
  for (const s of stars) {
    s.y += s.sp;
    if (s.y > H) { s.y = -s.s; s.x = Math.random() * W; }
    ctx.globalAlpha = 0.6;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  if (!over) drawPlayer(player);
  if (player.flash > 0) { ctx.fillStyle = 'rgba(255,0,0,'+(0.28*player.flash/18)+')'; ctx.fillRect(0, 0, W, H); }

  for (const b of bullets) {
    if (b.vy < 0) { ctx.fillStyle = '#ff5'; ctx.shadowColor = '#ff0'; ctx.shadowBlur = 6; ctx.fillRect(b.x, b.y, 4, 12); ctx.shadowBlur = 0; }
    else { ctx.fillStyle = '#0ff'; ctx.fillRect(b.x, b.y, 4, 8); }
  }
  for (const e of enemies) drawEnemy(e);
  if (miniBoss) drawMiniBoss(miniBoss);
  if (boss) drawBoss(boss);

  for (const p of props) {
    ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
    const label = p.type === 'scatter' ? 'S' : p.type === 'ammo' ? 'M' : p.type === 'rapid' ? 'R' : 'H';
    ctx.fillText(label, p.x+p.w/2, p.y+p.h/2+5);
  }
  for (const p of particles) { ctx.globalAlpha = p.life/30; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 3, 3); }
  ctx.globalAlpha = 1;

  if (boss) {
    const bw = Math.min(380, W-20), bx = (W-bw)/2;
    ctx.fillStyle = '#333'; ctx.fillRect(bx, 10, bw, 16);
    ctx.fillStyle = '#f80'; ctx.fillRect(bx, 10, bw * Math.max(0, boss.hp/boss.maxHp), 16);
    ctx.strokeStyle = '#fff'; ctx.strokeRect(bx, 10, bw, 16);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
    ctx.fillText('BOSS '+boss.hp+'/'+boss.maxHp+(boss.phase===2?' 阶段2/2':' 阶段1/2'), W/2, 24);
  }

  let h = 'HP '; for (let i = 0; i < 3; i++) h += i < player.hp ? '❤️' : '🖤';
  h += '<br>弹匣 '+player.ammo+'/'+player.maxAmmo;
  if (reloadTimer > 0) h += '<br>换弹 '+Math.ceil(reloadTimer/30)+'s';
  if (player.scatter > 0) h += '<br>🟩散射 '+Math.ceil(player.scatter/60)+'s';
  if (player.rapid > 0) h += '<br>🟦速射 '+Math.ceil(player.rapid/60)+'s';
  h += '<br>分数 '+score+'<br>最高 '+(+localStorage.getItem('planeBest')||0);
  hud.innerHTML = h;
}

addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); if (e.code === 'KeyP') togglePause(); });
addEventListener('keyup', e => { keys[e.code] = false; });
function togglePause() { if (over) return; paused = !paused; pauseBtn.textContent = paused ? '▶ 继续' : '⏸ 暂停'; if (!paused) loop(); }

cv.addEventListener('touchstart', e => {
  e.preventDefault(); touchActive = true;
  const r = cv.getBoundingClientRect();
  dragX = e.touches[0].clientX - r.left - (player.x + player.w/2);
  dragY = e.touches[0].clientY - r.top - (player.y + player.h/2);
}, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault(); if (!touchActive) return;
  const r = cv.getBoundingClientRect();
  player.x = e.touches[0].clientX - r.left - dragX - player.w/2;
  player.y = e.touches[0].clientY - r.top - dragY - player.h/2;
  player.x = Math.max(0, Math.min(W-player.w, player.x));
  player.y = Math.max(60, Math.min(H-player.h, player.y));
}, { passive: false });
cv.addEventListener('touchend', e => { e.preventDefault(); touchActive = false; }, { passive: false });
</script>
